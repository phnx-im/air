name: "air"
arch: "${PKG_ARCH}"
platform: "linux"
version: 0.24.0
release: "${RELEASE}"
section: "misc"
maintainer: "Phoenix R&D GmbH <hello@phnx.im>"
description: Air is an easy-to-use, secure messenger for chatting 1:1 and in groups.
vendor: "Phoenix R&D GmbH"
homepage: "https://air.ms"
license: "AGPL-3.0-or-later"
# changelog: "changelog.md"
overrides:
  rpm:
    contents:
      - src: ../build/linux/${LINUX_ARCH}/${APP_FLAVOR}/release/bundle/air
        expand: true
        dst: /usr/lib64/air/air
        file_info:
          mode: 0755
      - src: /usr/lib64/air/air
        dst: /usr/bin/air
        type: symlink
      - src: ../build/linux/${LINUX_ARCH}/${APP_FLAVOR}/release/bundle/data
        expand: true
        dst: /usr/lib64/air/data
        type: tree
      - src: ../build/linux/${LINUX_ARCH}/${APP_FLAVOR}/release/bundle/lib
        expand: true
        dst: /usr/lib64/air/lib
        type: tree
      - src: ./ms.air.Air.desktop
        dst: /usr/share/applications/ms.air.Air.desktop
      - src: ./ms.air.Air.service
        dst: /usr/share/dbus-1/services/ms.air.Air.service
      - src: ./ms.air.Air.svg
        dst: /usr/share/icons/hicolor/scalable/apps/ms.air.Air.svg
      - src: ./ms.air.Air.png
        dst: /usr/share/icons/hicolor/256x256/apps/ms.air.Air.png
    depends:
      - gtk3 >= 3.24.51
  deb:
    contents:
      - src: ../build/linux/${LINUX_ARCH}/${APP_FLAVOR}/release/bundle/air
        expand: true
        dst: /usr/lib/air/air
        file_info:
          mode: 0755
      - src: /usr/lib/air/air
        dst: /usr/bin/air
        type: symlink
      - src: ../build/linux/${LINUX_ARCH}/${APP_FLAVOR}/release/bundle/data
        expand: true
        dst: /usr/lib/air/data
        type: tree
      - src: ../build/linux/${LINUX_ARCH}/${APP_FLAVOR}/release/bundle/lib
        expand: true
        dst: /usr/lib/air/lib
        type: tree
      - src: ./ms.air.Air.desktop
        dst: /usr/share/applications/ms.air.Air.desktop
      - src: ./ms.air.Air.service
        dst: /usr/share/dbus-1/services/ms.air.Air.service
      - src: ./ms.air.Air.svg
        dst: /usr/share/icons/hicolor/scalable/apps/ms.air.Air.svg
      - src: ./ms.air.Air.png
        dst: /usr/share/icons/hicolor/256x256/apps/ms.air.Air.png
    depends:
      - libgtk-3-0
