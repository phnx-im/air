[graph]
targets = [
    "aarch64-apple-darwin",
    "aarch64-apple-ios",
    "aarch64-linux-android",
    "x86_64-apple-darwin",
    "x86_64-unknown-linux-gnu",
    "x86_64-windows-msvc",
]
all-features = false
no-default-features = false

[bans]
multiple-versions = "allow"

[advisories]
unsound = "all"
ignore = [
    # rsa is used via jsonwebtoken for signing FCM auth JWTs, where no
    # attacker-observable timing oracle is available
    { id = "RUSTSEC-2023-0071", reason = "fix unreleased, rsa 0.10 is still in rc and jsonwebtoken pins 0.9" },
    { id = "RUSTSEC-2026-0387", reason = "crypto-bigint 0.5 pinned via elliptic-curve 0.13 by jsonwebtoken, no 0.5.x patch available" },
    # There's no fix for this one yet, but it's fine to ignore because we don't
    # import databases.
    { id = "RUSTSEC-2026-0459", reason = "libsqlite3-sys 0.39 is blocked by sqlx-sqlite 0.9.0 and the openmls_sqlite_storage lock entry" },
]

[licenses]
# List of explicitly allowed licenses
# See https://spdx.org/licenses/ for list of possible licenses
# [possible values: any SPDX 3.11 short identifier (+ optional exception)].
allow = [
    "Apache-2.0 WITH LLVM-exception",
    "Apache-2.0",
    "BlueOak-1.0.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.8
exceptions = [
    { allow = [
        "AGPL-3.0-or-later",
    ], crate = "mls-assist" },
    { allow = [
        "AGPL-3.0-or-later",
    ], crate = "mimi_content" },
    { allow = [
        "AGPL-3.0-or-later",
    ], crate = "mimi-room-policy" },
    { allow = [
        "AGPL-3.0-or-later",
    ], crate = "apqmls" },
]

[licenses.private]
ignore = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = [
    # includes an unreleased patch of ml-dsa
    "https://github.com/RustCrypto/signatures",
    "https://github.com/openmls/openmls",
]

[sources.allow-org]
github = ["phnx-im"]
