name: Build Linux app (PR)

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Linux is cheap enough to build on every PR, so it carries no path filter.
on:
  pull_request:
    branches: ["main", "release/**"]
  merge_group:

jobs:
  linux:
    uses: ./.github/workflows/linux.yml
    secrets: inherit
