services:
  postgres:
    image: postgres:18.3
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: air_db
      # Speed up connections to the database
      POSTGRES_HOST_AUTH_METHOD: trust
    userns_mode: "keep-id:uid=999,gid=999"
    command: >
      postgres
      -c max_connections=1000
      -c fsync=off
      -c full_page_writes=off
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      start_period: 10s
      interval: 2s
      timeout: 5s
      retries: 10
    ports:
      - ${COMPOSE_BIND_HOST:-127.0.0.1}:5432:5432
    volumes:
      - postgres_data:/var/lib/postgresql

  minio:
    # MinIO community distribution
    image: docker.io/pgsty/silo:RELEASE.2026-09-03T13-18-01Z
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    entrypoint: ["/bin/sh", "-ec"]
    # Starts the server and creates the user and the buckets once it is live.
    command:
      - |
        rm -f /tmp/ready
        /usr/bin/docker-entrypoint.sh server /data --console-address ":9001" &
        server=$$!
        trap 'kill $$server; wait $$server; exit 0' TERM INT
        until curl -sf http://localhost:9000/minio/health/live; do sleep 0.2; done
        mc alias set local http://localhost:9000 minioadmin minioadmin
        mc admin user add local minioaccesskey miniosecretkey
        mc admin policy attach local readwrite --user=minioaccesskey
        mc mb --ignore-existing local/data
        mc mb --ignore-existing local/debug-logs
        touch /tmp/ready
        wait $$server
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/ready && curl -sf http://localhost:9000/minio/health/live"]
      start_period: 30s
      start_interval: 1s
      interval: 2s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  minio_data:
